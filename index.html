<h2>1872: Bakit mahalaga ang GOMBURZA?</h2>
<p>Ang <strong>GOMBURZA</strong> ay tatlong paring Pilipino: <strong>Mariano Gomez, José Burgos, at Jacinto Zamora</strong>. Binitay sila noong <strong>Pebrero 17, 1872</strong>. Ang pangyayaring ito ay nagbigay ng matinding pagkabahala at naging inspirasyon sa pagnanais ng pagbabago.</p>
<div class="visual"><div class="visual-title">Kilalanin ang GOMBURZA</div><div class="figure-grid"><div class="figure"><div class="monogram">GO</div><h3>Mariano Gomez</h3><small>PARI • CAVITE</small><p>Isa sa tatlong paring binitay noong 1872.</p></div><div class="figure"><div class="monogram">BUR</div><h3>José Burgos</h3><small>PARI • MAYNILA</small><p>Isa sa mga paring nagtaguyod ng karapatan ng paring Pilipino.</p></div><div class="figure"><div class="monogram">ZA</div><h3>Jacinto Zamora</h3><small>PARI • MAYNILA</small><p>Kasama sa tatlong paring kilala bilang GOMBURZA.</p></div></div></div>
<h2>José Rizal: Ang kapangyarihan ng panulat</h2>
<p>Ginamit ni <strong>José Rizal</strong> ang kaniyang mga akda upang ilantad ang mga suliranin at pang-aabuso sa lipunan. Kabilang sa kaniyang mga nobela ang <em>Noli Me Tangere</em> at <em>El Filibusterismo</em>. Inialay niya ang ikalawang nobela sa GOMBURZA.</p>
<p>Hindi siya ang nagtatag ng Katipunan. Naniniwala siya sa kahalagahan ng edukasyon at paghahanda, at nagpahayag ng pagtutol sa isang himagsikang kulang sa paghahanda. Binitay siya noong <strong>Disyembre 30, 1896</strong>.</p>
<div class="callout red"><span class="call-title">Huwag paghaluin ang dalawang tao</span><p><strong>José Rizal</strong> — manunulat at bayani na gumamit ng mga ideya at akda. <strong>Andrés Bonifacio</strong> — isa sa mga nagtatag at nanguna sa Katipunan.</p></div>
<h2>Reporma o Himagsikan?</h2>
<div class="compare-row"><div class="mini-card"><h3>🖋️ Kilusang Propaganda</h3><p>Naghanap ng <strong>reporma</strong> gamit ang pagsusulat, pagpapaliwanag, at mapayapang panghihikayat. Kabilang sa mga propagandista sina Rizal, Marcelo H. del Pilar, at Graciano López Jaena.</p></div><div class="mid">↔</div><div class="mini-card"><h3>🛡️ Katipunan</h3><p>Lihim na samahang naghangad ng <strong>kalayaan mula sa Espanya</strong> sa pamamagitan ng himagsikan.</p></div></div>
<h2>Isang madaling tandaan na pagkakasunod-sunod</h2>
<div class="visual"><div class="timeline"><div class="time-item"><time>1872</time><b>GOMBURZA</b><p>Pagbitay sa tatlong pari.</p></div><div class="time-item"><time>1887 at 1891</time><b>Mga nobela ni Rizal</b><p>Mga sulating nagmulat sa mga mambabasa.</p></div><div class="time-item"><time>1892</time><b>La Liga Filipina</b><p>Itinatag ni Rizal upang itaguyod ang mapayapang pagkakaisa at pagbabago.</p></div><div class="time-item"><time>1892</time><b>Katipunan</b><p>Naitatag ang lihim na samahan para sa kalayaan.</p></div></div></div>
<div class="callout teal"><span class="call-title">Tandaan / Remember</span><p>May mga Pilipinong gumamit ng <b>panulat</b> para sa reporma; ang iba ay gumamit ng <b>himagsikan</b> para sa kalayaan. Parehong mahalagang pag-aralan ang mga dahilan at naging epekto nila.</p></div>

{id:'katipunan',icon:'✊',name:'Ang Katipunan at Himagsikan ng 1896',short:'Pagkakatatag, Kartilya, Sigaw, Tejeros / A fight for freedom',pages:'Dagdag na materyal • pahina 64 at mga pagsusulit',duration:'12–14 minuto',kicker:'ARALIN 2 • 1892–1897',intro:'Paano nagsimula at lumawak ang kilusan para sa kasarinlan?',objectives:['Maipaliwanag ang layunin ng Katipunan.','Matukoy ang papel nina Bonifacio at Jacinto.','Maikuwento ang Sigaw ng 1896 at mga hamon sa pamumuno ng himagsikan.'],content:`
<h2>1892: Itinatag ang Katipunan</h2>
<p>Noong <strong>Hulyo 7, 1892</strong>, itinatag ang <strong>Kataastaasan, Kagalanggalangang Katipunan ng mga Anak ng Bayan (KKK)</strong>. Isa sa mga nagtatag nito si <strong>Andrés Bonifacio</strong>. Layunin ng samahan na makamit ang <strong>kalayaan mula sa pamahalaang Espanyol</strong>.</p>
<div class="callout teal"><span class="call-title">Isipin mo ito / Imagine this</span><p>Kung ang Kilusang Propaganda ay gumagamit ng <b>panulat para sa reporma</b>, ang Katipunan naman ay naghanda para sa <b>himagsikan at kasarinlan</b>.</p></div>
<h2>Sino-sino ang mahalagang tao?</h2>
<div class="figure-grid"><div class="figure"><div class="monogram">AB</div><h3>Andrés Bonifacio</h3><small>KATIPUNAN</small><p>Kasamang nagtatag ng Katipunan; naging isa sa mga pangunahing pinuno ng himagsikan.</p></div><div class="figure"><div class="monogram">EJ</div><h3>Emilio Jacinto</h3><small>KARTILYA</small><p>Sumulat ng <em>Kartilya ng Katipunan</em>, na nagtuturo ng mga prinsipyo at tamang asal sa mga kasapi.</p></div><div class="figure"><div class="monogram">GJ</div><h3>Gregoria de Jesus</h3><small>LAKAMBINI</small><p>Tumulong sa Katipunan at nag-ingat ng mahahalagang dokumento nito.</p></div></div>
<h2>1896: Ano ang Sigaw ng Himagsikan?</h2>
<p>Noong <strong>Agosto 1896</strong>, nagsimulang hayagang lumaban ang mga Katipunero sa pamamahalang Espanyol. Kilalang simbolo ng paghihiwalay sa kapangyarihan ng Espanya ang <strong>pagpunit ng mga cedula</strong> o dokumento ng pagbabayad ng buwis.</p>
<div class="callout"><span class="call-title">Mahalagang paalala tungkol sa petsa</span><p>May magkakaibang salaysay tungkol sa eksaktong petsa at lugar ng “Sigaw” (halimbawa, Pugad Lawin at Balintawak). Para sa pangunahing aral, tandaan ang <b>Agosto 1896</b> at ang simbolo ng pagpunit ng cedula.</p></div>
<h2>1897: Ano ang nangyari sa Tejeros?</h2>
<p>Nagkaroon ng pagpupulong at halalan sa <strong>Tejeros, Cavite</strong> noong 1897. Nahalal si <strong>Emilio Aguinaldo</strong> bilang pangulo ng itinatayong pamahalaang rebolusyonaryo. Nagkaroon ng hindi pagkakasundo sa halalan at sa pamumuno ng kilusan. Mahalaga ang pagkakaisa, ngunit may mga mahihirap ding pagtatalo sa kasaysayan.</p>
<div class="visual"><div class="visual-title">Apat na hakbang sa kuwento</div><div class="timeline"><div class="time-item"><time>Hulyo 1892</time><b>KKK</b><p>Naitatag ang Katipunan.</p></div><div class="time-item"><time>Agosto 1896</time><b>Sigaw ng Himagsikan</b><p>Hayagang paglaban; pagpunit ng mga cedula.</p></div><div class="time-item"><time>1897</time><b>Tejeros</b><p>Pagpupulong at halalan ng mga pinuno.</p></div><div class="time-item"><time>1897</time><b>Biak-na-Bato</b><p>Pagtangkang magkaroon ng pansamantalang kapayapaan.</p></div></div></div>

{id:'biak',icon:'🤝',name:'Kasunduan sa Biak-na-Bato',short:'Pansamantalang pagtigil sa labanan noong 1897',pages:'Pahina 38–42',duration:'8–10 minuto',kicker:'ARALIN 1 • 1897',intro:'Paano nagtangkang magkasundo ang mga Pilipino at Espanyol? Alamin kung bakit hindi pa rito natapos ang pakikibaka para sa kalayaan.',objectives:['Mailarawan ang layunin ng Kasunduan sa Biak-na-Bato.','Matukoy ang papel nina Emilio Aguinaldo at Pedro Paterno.','Maipaliwanag kung bakit pansamantala lamang ang kapayapaan.'],content:`
<h2>Ang tangka na magkaroon ng kapayapaan</h2>
<p>Noong <strong>1897</strong>, nagpatuloy ang labanan ng mga rebolusyonaryong Pilipino at ng mga Espanyol. Nagtungo ang ilang pinuno ng himagsikan sa <strong>Biak-na-Bato sa San Miguel, Bulacan</strong>. Naging mahalagang lugar ito sa kasaysayan ng rebolusyon.</p>
<div class="visual"><div class="visual-title">Tatlong mahalagang pangyayari</div><div class="timeline"><div class="time-item"><span class="date">1897</span><b>Pagpapatuloy ng himagsikan</b><p>Nanindigan ang mga Pilipino na ipaglaban ang kanilang mga karapatan.</p></div><div class="time-item"><span class="date">Biak-na-Bato</span><b>Pag-uusap para sa tigil-putukan</b><p>Sinubukang itigil muna ang labanan ng dalawang panig.</p></div><div class="time-item"><span class="date">Disyembre 1897</span><b>Kasunduan</b><p>Nagkaroon ng kasunduang naglalayong pansamantalang maghatid ng kapayapaan.</p></div><div class="time-item"><span class="date">Pagkatapos</span><b>Pagpunta sa Hong Kong</b><p>Nagtungo si Aguinaldo at ilang kasama sa Hong Kong bilang bahagi ng kasunduan.</p></div></div></div>
<h2>Sino ang sangkot sa kasunduan?</h2>
<div class="split"><div class="mini-card"><span class="emoji">👤</span><h3>Emilio Aguinaldo</h3><p>Isa sa mga pangunahing pinuno ng himagsikan na nakilahok sa kasunduan at nagtungo sa Hong Kong kasama ng ilang rebolusyonaryo.</p></div><div class="mini-card"><span class="emoji">🕊️</span><h3>Pedro Paterno</h3><p>Nagsilbing tagapamagitan sa mga pag-uusap sa pagitan ng mga rebolusyonaryo at ng pamahalaang Espanyol.</p></div></div>
<div class="callout"><span class="call-title">💡 Tandaan mo!</span><p>Ang <strong>tigil-putukan</strong> ay pansamantalang paghinto ng labanan. <strong>Hindi ito kapareho ng ganap na kalayaan.</strong> Hindi rin tuluyang natapos ang alitan sa Kasunduan sa Biak-na-Bato.</p></div>
<h2>Isipin at ihambing</h2><div class="compare-row"><div class="mini-card"><h3>Kasunduan</h3><p>Layunin nitong pahintuin muna ang labanan at magtakda ng mga pangako.</p></div><div class="mid">≠</div><div class="mini-card"><h3>Ganap na kalayaan</h3><p>Malayang nakapagpapasya ang bansa para sa sarili nito.</p></div></div>

{id:'kalayaan',icon:'🇵🇭',name:'Pagpapahayag ng Kalayaan',short:'Mula sa pagbabalik hanggang Hunyo 12, 1898',pages:'Pahina 42–50',duration:'9–11 minuto',kicker:'ARALIN 2 • 1898',intro:'Alamin ang mahahalagang pangyayari bago at sa mismong araw ng pagpapahayag ng kalayaan ng Pilipinas.',objectives:['Maisaayos ang mahahalagang pangyayari noong Mayo at Hunyo 1898.','Matukoy ang petsa at lugar ng pagpapahayag ng kalayaan.','Makilala ang mga taong may ambag sa pagdiriwang ng kalayaan.'],content:`
<h2>Muling nagpatuloy ang pakikibaka</h2><p>Bumalik si <strong>Emilio Aguinaldo</strong> mula sa Hong Kong noong <strong>Mayo 1898</strong>. Nagpatuloy ang pakikibaka, at nagkaroon ng mahahalagang tagumpay ang mga rebolusyonaryo.</p>
<div class="visual"><div class="visual-title">Timeline: Mga pangyayaring dapat tandaan</div><div class="timeline"><div class="time-item"><time>Mayo 1898</time><b>Pagbabalik ni Aguinaldo</b><p>Ipagpapatuloy ang rebolusyon laban sa pamamahalang Espanyol.</p></div><div class="time-item"><time>Mayo 28, 1898</time><b>Tagumpay sa Alapan</b><p>Naging mahalaga sa kasaysayan ng unang pagpapakita ng watawat ng Pilipinas sa tagumpay.</p></div><div class="time-item"><time>Hunyo 12, 1898</time><b>Pagpapahayag ng Kalayaan</b><p>Idineklara ang kalayaan sa Kawit, Cavite.</p></div><div class="time-item"><time>Pagkatapos nito</time><b>Pagbuo ng pamahalaan</b><p>Sinikap ng mga Pilipino na magtatag ng sariling pambansang pamahalaan.</p></div></div></div>
<h2>Hunyo 12 sa Kawit, Cavite</h2><p>Noong <strong>Hunyo 12, 1898</strong>, ipinahayag ang kalayaan ng Pilipinas mula sa Espanya sa <strong>Kawit, Cavite</strong>. Mahalaga ang okasyong ito bilang pagpapakita ng hangarin ng mga Pilipino na mamahala sa sarili.</p>

<div class="visual"><div class="visual-title">Tatlong mahalagang hakbang</div><div class="timeline"><div class="time-item"><time>Setyembre 15, 1898</time><b>Kongreso ng Malolos</b><p>Nagsimula ang pagpupulong ng mga kinatawan sa Simbahan ng Barasoain sa Malolos, Bulacan.</p></div><div class="time-item"><time>Enero 21, 1899</time><b>Saligang Batas ng Malolos</b><p>Pinagtibay ang saligang batas para sa pamahalaan ng bagong republika.</p></div><div class="time-item"><time>Enero 23, 1899</time><b>Unang Republika</b><p>Pinasinayaan ang Unang Republika ng Pilipinas sa Malolos, Bulacan.</p></div></div></div>
<h2>Ano ang pagkakaiba ng tatlong ito?</h2><div class="figure-grid"><div class="figure"><div class="monogram">01</div><h3>Kongreso</h3><small>MGA KINATAWAN</small><p>Grupo ng mga pinunong nagtatalakay at gumagawa ng mga batas para sa bayan.</p></div><div class="figure"><div class="monogram">02</div><h3>Saligang Batas</h3><small>PANGUNAHING BATAS</small><p>Nagtatakda ng balangkas ng pamahalaan at mahahalagang karapatan at tungkulin.</p></div><div class="figure"><div class="monogram">03</div><h3>Republika</h3><small>PAMAHALAAN</small><p>Uri ng pamahalaang pinamumunuan ng mga kinatawan at pinunong naglilingkod sa mamamayan.</p></div></div>
<h2>Mga pinunong may mahalagang papel</h2><div class="split"><div class="mini-card"><span class="emoji">📜</span><h3>Felipe Calderon</h3><p>May mahalagang papel sa pagbabalangkas ng Saligang Batas ng Malolos.</p></div><div class="mini-card"><span class="emoji">🧭</span><h3>Apolinario Mabini</h3><p>Nagbigay ng mahahalagang payo tungkol sa pamahalaan at mga patakaran ng bansa.</p></div></div>
<div class="callout teal"><span class="call-title">🧠 Madaling tandaan</span><p><strong>Kongreso</strong> = nag-uusap tungkol sa mga batas. <strong>Saligang Batas</strong> = batayang tuntunin ng pamahalaan. <strong>Republika</strong> = pamahalaang isinasaayos ayon sa mga tuntuning ito.</p></div>
<h2>Isang hamong kinaharap</h2><p>Bagaman naitatag ang Unang Republika, hindi pa natatapos ang mga pagsubok. May mga dayuhang kapangyarihang hindi kumilala sa kalayaang ipinahayag ng mga Pilipino. Patuloy na ipinaglaban ang karapatang mamahala sa sariling bayan.</p>

{id:'ambag',icon:'🧭',name:'Ambag ng mga Pilipino',short:'Iba-ibang paraan ng pagtatanggol sa bayan',pages:'Pahina 59–73',duration:'8–10 minuto',kicker:'ARALIN 5 • PAG-UUGNAY',intro:'Paano nagtulungan ang iba’t ibang Pilipino upang makamit ang iisang layunin? Suriin ang mga gawaing makabayan.',objectives:['Matukoy ang iba’t ibang uri ng kontribusyon sa himagsikan.','Maipaliwanag kung bakit mahalaga ang pagtutulungan.','Makabuo ng simpleng halimbawa ng paglilingkod sa bayan ngayon.'],content:`
<h2>Hindi iisa ang paraan ng pagmamahal sa bayan</h2><p>Sa panahon ng himagsikan, may mga lumaban sa larangan, may sumulat at nagpalaganap ng mga ideya, may naglaan ng pagkain at gamot, at may nakipag-usap upang ipaglaban ang mga karapatan ng Pilipinas.</p>
<div class="visual"><div class="visual-title">Apat na paraan ng pakikiisa</div><div class="figure-grid"><div class="figure"><div class="monogram">🛡️</div><h3>Pakikipaglaban</h3><small>KATAPANGAN</small><p>Pagharap sa panganib upang ipagtanggol ang bayan.</p></div><div class="figure"><div class="monogram">✍️</div><h3>Pagsulat at pagpapaliwanag</h3><small>KAALAMAN</small><p>Pagpapalaganap ng ideya tungkol sa karapatan at kalayaan.</p></div><div class="figure"><div class="monogram">🤲</div><h3>Pag-aalaga at suporta</h3><small>MALASAKIT</small><p>Pagbibigay ng pagkain, gamot, tirahan, at kagamitan.</p></div><div class="figure"><div class="monogram">🌍</div><h3>Diplomasiya</h3><small>PAKIKIPAG-UGNAYAN</small><p>Pakikipag-usap sa ibang bansa upang ipaliwanag at ipagtanggol ang adhikain ng Pilipinas.</p></div></div></div>
<h2>Bakit mahalaga ang pagkakaisa?</h2><p>Iba-iba ang kakayahan at pinanggalingan ng mga Pilipino, ngunit marami ang nagkaisa sa pangarap na magkaroon ng sariling pamahalaan. Mahalaga ring kilalanin ang mga grupong kadalasang hindi nababanggit sa maiikling salaysay ng kasaysayan.</p>
<div class="callout"><span class="call-title">⭐ Mahalagang kaisipan</span><p>Ang kalayaan ay hindi gawa ng iisang tao. Bunga ito ng <strong>sama-samang pagkilos, sakripisyo, at pangarap</strong> ng maraming Pilipino.</p></div>
<h2>Maiuugnay mo ba ito sa kasalukuyan?</h2><div class="checklist"><div><b>Sa paaralan:</b> Pagtulong sa kaklaseng nahihirapan.</div><div><b>Sa komunidad:</b> Pakikilahok sa paglilinis at pangangalaga sa kapaligiran.</div><div><b>Sa tahanan:</b> Pagiging responsable at paggalang sa iba.</div></div>
<div class="reflection panel" style="background:#f7fafb"><label for="responseAmbag">✏️ Gawain: Paano mo maipapakita ang pagmamahal sa bayan bilang mag-aaral?</label><textarea id="responseAmbag" data-reflection="ambag" placeholder="Halimbawa: Tutulong ako sa aming paaralan sa pamamagitan ng…"></textarea><div class="subtext">Awtomatikong sine-save sa browser na ito ang iyong sagot.</div></div>

ugat:[['1872: Why does GOMBURZA matter?','GOMBURZA means Gomez, Burgos, and Zamora, three Filipino priests executed on February 17, 1872. Their deaths strengthened demands for justice and reform.'],['José Rizal: The power of writing','Rizal wrote Noli Me Tangere and El Filibusterismo to show injustice. He dedicated the second novel to GOMBURZA. He was not the founder of the Katipunan and was executed on December 30, 1896.'],['Reform or revolution?','The Propaganda Movement mainly asked for reforms through writing and peaceful appeals. The Katipunan later organized a struggle for independence from Spain.'],['Put the events in order','1872: GOMBURZA. 1887 and 1891: Rizal’s novels. 1892: La Liga Filipina and the Katipunan. Learn the cause-and-effect connection, not just the dates.']],
katipunan:[['1892: Founding of the Katipunan','The Katipunan, or KKK, was founded on July 7, 1892. Andrés Bonifacio was one of its founders. Its goal was independence from Spanish rule.'],['Important people','Andrés Bonifacio helped found and lead the Katipunan. Emilio Jacinto wrote its Kartilya, a guide to values. Gregoria de Jesus protected Katipunan documents.'],['1896: The Cry of the Revolution','The revolution began in August 1896. Tearing up cedulas (tax certificates) became a symbol of rejecting Spanish authority. Historical accounts differ on the exact date and place of the Cry.'],['1897: Tejeros Convention','Revolutionary leaders met and held an election in Tejeros, Cavite. Emilio Aguinaldo was elected president. The election also caused leadership disputes.']],

kalayaan:[['The struggle continued','Emilio Aguinaldo returned from Hong Kong in May 1898. Filipino revolutionary forces continued their campaign; the victory at Alapan took place on May 28, 1898.'],['June 12 in Kawit, Cavite','On June 12, 1898, Filipino independence from Spain was declared at Kawit, Cavite. The declaration was an important step but did not end every conflict immediately.'],['Meet the contributors','Aguinaldo led the event. Ambrosio Rianzares Bautista read the declaration. Julian Felipe composed the march. José Palma later wrote the poem used for the lyrics. Marcela Agoncillo helped sew the flag.']],
malolos:[['From a declaration to government','After declaring independence, leaders worked to build a government. The Malolos Congress opened on September 15, 1898 at Barasoain Church in Bulacan. The First Philippine Republic was inaugurated on January 23, 1899.'],['Three different ideas','Congress is a group of representatives who discuss laws. A constitution gives the basic rules of government. A republic is a form of government with representatives.'],['Leaders and their contributions','Emilio Aguinaldo was president of the First Republic. Felipe Calderón played a major role in drafting the Malolos Constitution. Apolinario Mabini contributed important political ideas.'],['A challenge ahead','The Philippines still faced conflicts and disagreements. Declaring independence and organizing a republic did not end all of the nation’s problems.']],
kababaihan:[['Many forms of courage','Women supported the revolution by giving food, caring for the injured, protecting messages, organizing communities, and sometimes fighting. Courage was not limited to carrying weapons.'],['Meet the women','Melchora Aquino (Tandang Sora) helped revolutionaries. Gregoria de Jesus protected Katipunan documents. Teresa Magbanua led fighters in the Visayas. Trinidad Tecson, Marina Dizon, Gliceria Villavicencio, and Agueda Kahabagan also made important contributions.']],

function nav(){const entries=[['home','⌂','Simula'],...lessons.map((x,i)=>[x.id,String(i+1),x.name]),['review','✓','Pangwakas na Pagsusulit'],['practice','✎','Exam-style Practice'],['glossary','Aa','Talasalitaan'],['record','★','Aking Rekord']];$('navMain').innerHTML=entries.map(([id,n,label],i)=>`${i===lessons.length+1?'<div class="nav-heading">Pagtataya at sanggunian</div>':''}<button type="button" class="navbtn ${page===id?'active':''}" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="navnum">${n}</span><span>${label}</span>${state.scores[id]!=null?'<span class="done" title="Nasubukan na">✓</span>':''}</button>`).join('');$('progressBar').style.width=(scoreCount()/(lessons.length+2)*100)+'%';$('progressText').textContent=`${scoreCount()} sa ${lessons.length+2} pagsusulit ang nasubukan`}
function jump(id){if(!['home','review','practice','glossary','record',...lessons.map(l=>l.id)].includes(id))id='home';page=id;closeMenu();window.location.hash=id;draw();window.scrollTo({top:0,behavior:'instant'})}
function closeMenu(){$('sidebar').classList.remove('open');$('shade').classList.remove('show');$('menuOpen').setAttribute('aria-expanded','false')}
function header(title,desc,tagline){return `<div class="lesson-intro"><div class="eyebrow">${tagline}</div><h1 class="content-title">${title}</h1><p class="lead">${desc}</p></div>`}
function home(){return `<header class="hero"><div class="eyebrow">ARALING PANLIPUNAN • BAITANG 6</div><h1>Landas ng Kalayaan</h1><p>Isang masaya at madaling sundang paglalakbay sa Himagsikang Pilipino, pagpapahayag ng kalayaan, Unang Republika, at ambag ng mga Pilipino.</p><button type="button" class="btn primary" data-page="ugat">Simulan ang Aralin 1 <span aria-hidden="true">→</span></button><div class="hero-stats"><span>📚 ${lessons.length} maiikling aralin</span><span>🧠 Pagsusulit sa bawat aralin</span><span>🏆 12-item final + 18-item practice</span></div></header>
<div class="panel intro-panel"><strong>👋 Kumusta, batang historyador! / Hello, young historian!</strong><p class="bilingual-intro english-assist">Start with Lesson 1. Each Filipino topic has a simple English explanation. Use the language selector above to choose Filipino, Bilingual, or an English-first study guide. Quizzes explain the answers, so you can learn from mistakes.</p><p>Basahin ang bawat aralin. Sa dulo ng bawat aralin, sagutan ang <b>“Subukin ang Kaalaman!”</b> at pindutin ang <b>“Suriin ang mga sagot.”</b> Makikita mo ang iyong marka at paliwanag. Maaari kang magsanay muli.</p><p class="muted" style="margin-bottom:0;font-size:.82rem">Ang iyong pinakamahusay na marka at sinulat na sagot ay itinatago lamang sa browser ng aparatong ginagamit mo.</p></div>
<h2 class="section-label">Piliin ang aralin</h2><div class="card-grid">${lessons.map((l,i)=>`<button type="button" class="lesson-card" data-page="${l.id}"><span class="iconbubble">${l.icon}</span><strong>Aralin ${i+1}: ${l.name}</strong><small>${l.short}</small><span class="view">Buksan ang aralin → ${state.scores[l.id]!=null?' • Nasubukan na ✓':''}</span></button>`).join('')}</div>
<h2 class="section-label">Pagkatapos ng ${lessons.length} aralin</h2><div class="panel"><h3 style="margin:0 0 7px;color:var(--navy)">🏁 Handa ka na bang subukin ang lahat ng iyong natutuhan?</h3><p class="muted">May 12 tanong na sumasaklaw sa buong modyul. Maaari mong balikan ang mga aralin kung kailangan mo pang magpraktis.</p><button type="button" class="btn" data-page="review">Pumunta sa Pangwakas na Pagsusulit →</button> <button type="button" class="btn secondary" data-page="practice">Exam-style Practice →</button></div><p class="footnote">Batayan: mga larawan ng aklat (kabilang ang pahina 38–89), mga karagdagang pahina 64–65 at 76–87, at mga halimbawa ng pagsusulit. Muling isinulat ang paliwanag para maging mas madaling basahin ng Baitang 6.</p>`}
function lesson(l){let index=lessons.findIndex(x=>x.id===l.id);return `${header(l.name,l.intro,l.kicker)}<div class="bilingual-intro english-assist">${esc(englishTitles[l.id]||l.name)} — Read a short English explanation after each Filipino section, or choose English help above.</div><div class="tagline"><span class="tag">${l.pages}</span><span class="tag gray">⏱ ${l.duration}</span><span class="tag gray">${state.scores[l.id]!=null?'✓ Nasubukan na ang pagsusulit':'✦ May kaalaman-check'}</span></div><div class="panel"><div class="eyebrow">🎯 LAYUNIN NG PAGKATUTO</div><ul class="objectives">${l.objectives.map(x=>`<li>${x}</li>`).join('')}</ul><div class="bilingual-objectives english-assist"><strong>Learning goals:</strong> ${(objectiveEnglish[l.id]||englishSections[l.id].slice(0,3).map(x=>x[0])).map(x=>`<div>✓ ${esc(x)}</div>`).join('')}</div></div>${sectionGuide(l.id)}<article class="lesson-body fil-primary">${injectEnglish(l.id,l.content)}</article><details class="original-filipino"><summary>Show the original Filipino lesson and illustrations / Basahin ang orihinal</summary><article class="lesson-body">${l.content}</article></details>${quiz(l.id,l.questions,false)}<div class="lesson-footer"><button type="button" class="btn secondary" data-page="${index===0?'home':lessons[index-1].id}">← ${index===0?'Simula':'Naunang aralin'}</button><button type="button" class="btn" data-page="${index===lessons.length-1?'review':lessons[index+1].id}">${index===lessons.length-1?'Pangwakas na Pagsusulit':'Susunod na aralin'} →</button></div><p class="footnote">English help provides a study summary; Filipino text remains available in the original reading. Ang mga paliwanag ay pinasimple para sa pag-aaral at nakabatay sa mga pahinang nakasaad sa itaas.</p>`}
function quiz(id,qs,final){const s=state.scores[id];return `<section class="panel" aria-label="${final?'Pangwakas na pagsusulit':'Subukin ang kaalaman'}"><div class="quiz-head"><div><div class="eyebrow">${final?'🏆 PANGWAKAS NA PAGTATAYA':'🧠 KAALAMAN CHECK'}</div><h2 style="font-size:1.34rem;margin:7px 0;color:var(--navy)">${final?'Subukin ang Lahat ng Natutuhan':'Subukin ang Kaalaman!'}</h2><p class="muted" style="font-size:.85rem;margin:4px 0 10px">${qs.length} na tanong • Pumili ng isang sagot sa bawat bilang.</p></div>${s!=null?`<div class="quiz-score">Pinakamataas: ${s}/${qs.length}</div>`:''}</div>
<form class="quiz-form" data-quiz="${id}" novalidate>${qs.map((q,i)=>`<fieldset class="question" id="q-${id}-${i}"><legend class="sr-only">Tanong ${i+1}</legend><span class="qnum">TANONG ${i+1} SA ${qs.length}</span><h3>${esc(q[0])}</h3><div class="q-en english-assist">🇬🇧 ${englishTextForQuestion(id,q,i)}</div><div class="answers">${q[1].map((a,j)=>`<label class="answer"><input type="radio" name="a${i}" value="${j}" ${state.answers[id]?.[i]===j?'checked':''}><span>${esc(a)}<span class="a-en english-assist">${englishTextForChoice(id,q,i,j)}</span></span></label>`).join('')}</div><div class="feedback" id="f-${id}-${i}" aria-live="polite"></div></fieldset>`).join('')}
<div id="missing-${id}" role="alert"></div><div class="quiz-actions"><button type="submit" class="btn">Suriin ang mga sagot ✓</button><button type="button" class="btn secondary" data-retry="${id}">Ulitin ang pagsasanay ↺</button></div><div class="result" id="result-${id}" aria-live="polite"></div></form></section>`}
function review(){return `${header('Pangwakas na Pagsusulit','Balikan ang mahahalagang pangyayari, petsa, lugar, at mga taong nag-ambag sa kasaysayan.','PAGTATAYA • 12 TANONG')}<div class="callout teal"><span class="call-title">Handa ka na!</span><p>Basahing mabuti ang bawat tanong. Kapag tapos na, pindutin ang <b>“Suriin ang mga sagot”</b> upang makita ang iyong marka at ang mga paliwanag.</p></div>${quiz('review',finalQuestions,true)}<div class="lesson-footer"><button type="button" class="btn secondary" data-page="ambag">← Balikan ang Huling Aralin</button><button type="button" class="btn" data-page="record">Tingnan ang Aking Rekord →</button></div>`}
function practice(){return `${header('Exam-style Practice / Pagsasanay','Original practice questions based on the added textbook pages and sample examination, including paired true/false statements. These are for studying, not an answer key to the school exam.','PAGSASANAY • 18 QUESTIONS')}<div class="callout teal"><span class="call-title">Tip / Paalala</span><p>Try answering first. Then check your score and read both Filipino and English explanations. You can retry as often as needed.</p></div>
<section class="panel"><span class="eyebrow">✍️ WRITING PRACTICE / GAWAING PAGSULAT</span><h2 style="margin:8px 0;color:var(--navy)">Liham kay Inang Bayan / A Letter to Our Country</h2><p>Sumulat ng <b>6–8 pangungusap</b> tungkol sa kahalagahan ng kalayaan at paano ito mapapangalagaan.</p><p class="english-assist" style="color:#136875">Write 6–8 short sentences. What does freedom mean to you, and what can a student do to protect it?</p><div class="visual"><div class="visual-title">A simple 4-step writing plan</div><div class="checklist"><div>① <b>Pagbati / Greeting:</b> Mahal kong Inang Bayan, / Dear Philippines,</div><div>② <b>Kahulugan / Meaning:</b> Ang kalayaan ay… / Freedom means…</div><div>③ <b>Pasasalamat / Gratitude:</b> Salamat sa… / Thank you for…</div><div>④ <b>Pangako / Promise:</b> Bilang mag-aaral, ako ay… / As a student, I will…</div></div></div><div class="reflection"><label for="essayLetter">Aking liham / My letter</label><textarea id="essayLetter" data-reflection="letter" placeholder="Mahal kong Inang Bayan,&#10;&#10;Ang kalayaan ay..." style="min-height:170px"></textarea><span class="subtext">Your writing stays in this browser. It is not automatically graded.</span></div><details style="margin-top:15px"><summary style="cursor:pointer;font-weight:800;color:var(--teal)">See a short sample / Tingnan ang halimbawa</summary><p><b>Filipino:</b> Mahal kong Inang Bayan, mahalaga sa akin ang ating kalayaan. Ito ay nagbibigay ng pagkakataong makapag-aral at makapagsalita nang may pananagutan. Nagpapasalamat ako sa mga taong nagsakripisyo para sa bayan. Bilang mag-aaral, mag-aaral akong mabuti. Igagalang ko ang aking kapwa. Aalagaan ko ang ating paaralan at kapaligiran. Tutulong ako upang manatiling nagkakaisa ang ating komunidad.</p><p class="english-assist"><b>English:</b> Dear Philippines, our freedom matters to me. It lets us learn and express ourselves responsibly. I thank the people who sacrificed for our country. As a student, I will study well, respect others, care for our school, and help my community.</p></details><div class="callout teal"><span class="call-title">Simple rubric / Paano mamarkahan?</span><p><b>Nilalaman / Content:</b> 2 points · <b>Paliwanag / Explanation:</b> 2 points · <b>Organisasyon / Organization:</b> 1 point. Total: <b>5 points</b>.</p></div></section>
${quiz('practice',practiceQuestions,true)}<div class="lesson-footer"><button type="button" class="btn secondary" data-page="review">← Final Review</button><button type="button" class="btn" data-page="record">My Learning Record →</button></div>`}
function vocab(){return `${header('Talasalitaan','Pindutin ang isang salita upang mabasa ang simpleng kahulugan nito.','MGA SALITANG DAPAT TANDAAN')}<div class="vocab-grid">${glossary.map(([word,desc])=>`<details class="vocab"><summary>${word}</summary><p>${desc}</p><p class="english-assist" style="color:#146875"><strong>English:</strong> ${esc(vocabEnglish[word]||"A key Filipino word used in Philippine history.")}</p></details>`).join('')}</div><div class="panel"><h2 style="margin-top:0;color:var(--navy)">📖 Paano magreview?</h2><p>Pumili ng limang salita. Ipaliwanag ang bawat isa gamit ang sarili mong pangungusap. Pagkatapos, balikan ang mga aralin at hanapin kung saan ginamit ang mga salita.</p></div>`}
function record(){const tried=scoreCount();const total=lessons.reduce((s,l)=>s+(state.scores[l.id]||0),0)+(state.scores.review||0)+(state.scores.practice||0);const max=lessons.reduce((n,l)=>n+l.questions.length,0)+finalQuestions.length+practiceQuestions.length;return `${header('Aking Learning Record','Tingnan ang iyong pag-unlad at isulat ang pinakamahalagang natutuhan mo.','PAGNINILAY • AKING PAG-UNLAD')}<div class="panel"><div class="field-row"><div class="reflection"><label for="studentName">Pangalan ng mag-aaral (opsyonal)</label><input id="studentName" type="text" maxlength="90" placeholder="Isulat ang pangalan" value="${esc(state.name)}"></div><div class="mini-card"><span class="seal">🏅</span><strong style="display:block;color:var(--navy)">${tried} sa 6 pagsusulit ang nasubukan</strong><small class="muted">Pinagsamang pinakamataas na marka: ${total}/${max}</small></div></div><div style="margin-top:20px">${[...lessons.map((l,i)=>[l.id,`Aralin ${i+1}: ${l.name}`,l.questions.length]),['review','Pangwakas na Pagsusulit',finalQuestions.length],['practice','Exam-style Practice',practiceQuestions.length]].map(([id,label,n])=>`<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:11px 0;font-size:.88rem"><span>${label}</span><strong>${state.scores[id]!=null?`${state.scores[id]}/${n}`:'Hindi pa nasusubukan'}</strong></div>`).join('')}</div></div>
<div class="panel reflection"><h2 style="margin:0;color:var(--navy)">✍️ Pagninilay: Ang Aking Natutuhan</h2><label for="responseTandaan">1. Ang pinakamahalagang natutuhan ko sa himagsikan ay…</label><textarea id="responseTandaan" data-reflection="tandaan" placeholder="Isulat ang sagot sa sarili mong mga salita."></textarea><label for="responseInspirasyon">2. Ang taong hinahangaan ko sa aralin ay… dahil…</label><textarea id="responseInspirasyon" data-reflection="inspirasyon" placeholder="Piliin ang isang tauhan at ipaliwanag kung bakit."></textarea><label for="responseBuhay">3. Maipapakita ko ang pagmamahal sa bayan sa pamamagitan ng…</label><textarea id="responseBuhay" data-reflection="buhay" placeholder="Magbigay ng isang gawaing kaya mong simulan ngayon."></textarea><small class="subtext">Ang mga sagot ay naitatago sa browser na ito. Para magkaroon ng kopya, gamitin ang Print / Save as PDF.</small><div class="quiz-actions"><button class="btn" type="button" id="printRecord">⎙ I-print / I-save bilang PDF</button><button class="btn secondary" type="button" id="downloadNotes">↓ I-save ang aking mga sagot (.txt)</button></div></div>
<div class="panel"><h3 style="color:var(--navy);margin-top:0">🔒 Tungkol sa iyong datos</h3><p class="muted" style="font-size:.86rem">Walang account o internet na kailangan. Hindi ipinapadala ang mga sagot sa guro o sa ibang website. Kung magbura ka ng browser data o gumamit ng ibang device, maaaring hindi makita ang nakaraang rekord.</p><button class="btn secondary small" type="button" id="resetAll">Burahin ang lahat ng aking progreso</button></div>`}
function draw(){document.documentElement.dataset.lang=state.lang||'both';$('langSelect').value=state.lang||'both';nav();$('crumb').textContent='ARALING PANLIPUNAN 6 / '+(page==='home'?'SIMULA':page==='review'?'PAGSUSULIT':page==='practice'?'PRACTICE':page==='record'?'REKORD':page==='glossary'?'TALASALITAAN':`ARALIN ${lessons.findIndex(l=>l.id===page)+1}`);$('content').innerHTML=page==='home'?home():page==='review'?review():page==='practice'?practice():page==='glossary'?vocab():page==='record'?record():lesson(lessons.find(l=>l.id===page));
$('content').querySelectorAll('[data-reflection]').forEach(el=>{el.value=state.reflections[el.dataset.reflection]||''});
$('content').querySelectorAll('form.quiz-form').forEach(el=>{if(state.attempts[el.dataset.quiz])showFeedback(el.dataset.quiz,el,false)});
}
function showFeedback(id,form,focus){const qs=id==='review'?finalQuestions:id==='practice'?practiceQuestions:lessons.find(l=>l.id===id).questions;const choices=state.answers[id]||{};let n=0;qs.forEach((q,i)=>{const good=choices[i]===q[2];if(good)n++;const f=$(`f-${id}-${i}`);if(!f)return;f.className='feedback show '+(good?'good':'bad');f.innerHTML=`<strong>${good?'✓ Tama!':'↗ Pag-aralan muli.'}</strong> ${esc(q[3])}<span class="ex-en english-assist">🇬🇧 ${englishExplanation(id,q)}</span>${good?'':` <strong>Tamang sagot: ${esc(q[1][q[2]])}.</strong>`}`;const opts=form.querySelectorAll(`[name="a${i}"]`);opts.forEach(x=>{x.closest('label').classList.toggle('is-correct',Number(x.value)===q[2]);x.closest('label').classList.toggle('is-wrong',x.checked&&!good)})});const result=$('result-'+id);if(result){result.className='result show';result.innerHTML=`<strong>🎉 Ang iyong marka: ${n} / ${qs.length}</strong><p>${n===qs.length?'Napakahusay! Lahat ng sagot mo ay tama.':n>=Math.ceil(qs.length*.75)?'Magaling! Balikan ang ilang paliwanag upang lalo pang tumibay ang iyong kaalaman.':'Kaya mo ito! Basahin ang mga paliwanag sa bawat tanong at subukang muli.'}</p>`;if(focus)result.scrollIntoView({behavior:'smooth',block:'center'})}return n}
function submitQuiz(form){const id=form.dataset.quiz;const qs=id==='review'?finalQuestions:id==='practice'?practiceQuestions:lessons.find(l=>l.id===id).questions;const answer={};let missing=[];qs.forEach((q,i)=>{const chosen=form.querySelector(`input[name="a${i}"]:checked`);if(!chosen)missing.push(i+1);else answer[i]=Number(chosen.value)});const notice=$('missing-'+id);if(missing.length){notice.innerHTML=`<div class="empty-hint">Paki-sagutan muna ang bilang ${missing.join(', ')} bago suriin ang iyong mga sagot.</div>`;form.querySelector(`input[name="a${missing[0]-1}"]`)?.focus();return}notice.innerHTML='';state.answers[id]=answer;state.attempts[id]=true;const mark=showFeedback(id,form,true);state.scores[id]=Math.max(mark,state.scores[id]||0);save();nav();const sc=$('content').querySelector('.quiz-score');if(sc)sc.textContent='Pinakamataas: '+state.scores[id]+'/'+qs.length}
function retry(id){delete state.answers[id];delete state.attempts[id];save();draw();const form=$(`q-${id}-0`);if(form)form.scrollIntoView({behavior:'smooth',block:'start'})}
function exportNotes(){const lines=[`ARALING PANLIPUNAN 6 — AKING REKORD`,`Pangalan: ${state.name||'(hindi inilagay)'}`,``,`Mga pagsusulit:`,...lessons.map((l,i)=>`${i+1}. ${l.name}: ${state.scores[l.id]!=null?state.scores[l.id]+'/'+l.questions.length:'Hindi pa nasusubukan'}`),`Pangwakas: ${state.scores.review!=null?state.scores.review+'/'+finalQuestions.length:'Hindi pa nasusubukan'}`,`Exam-style Practice: ${state.scores.practice!=null?state.scores.practice+'/'+practiceQuestions.length:'Hindi pa nasusubukan'}`,``,`Aking natutuhan:`,state.reflections.tandaan||'',``,`Taong hinahangaan ko:`,state.reflections.inspirasyon||'',``,`Aking magagawa:`,state.reflections.buhay||'',``,`Ambag bilang mag-aaral:`,state.reflections.ambag||''];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='AP6_Aking_Rekord.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('navMain').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)jump(b.dataset.page)});
$('content').addEventListener('click',e=>{const go=e.target.closest('[data-page]');if(go){jump(go.dataset.page);return}const retryBtn=e.target.closest('[data-retry]');if(retryBtn){retry(retryBtn.dataset.retry);return}if(e.target.closest('#printRecord'))window.print();if(e.target.closest('#downloadNotes'))exportNotes();if(e.target.closest('#resetAll')){if(confirm('Buburahin nito ang lahat ng marka at isinulat na sagot sa browser na ito. Magpatuloy?')){state={scores:{},attempts:{},answers:{},reflections:{},name:'',font:1,lang:'both'};save();document.documentElement.style.setProperty('--scale','1');jump('home')}}});
$('content').addEventListener('submit',e=>{const form=e.target.closest('.quiz-form');if(!form)return;e.preventDefault();submitQuiz(form)});
$('content').addEventListener('change',e=>{const inp=e.target;if(!inp.matches('form.quiz-form input[type="radio"]'))return;const form=inp.closest('form');const id=form.dataset.quiz;if(state.attempts[id]){delete state.attempts[id];save();form.querySelectorAll('.feedback').forEach(x=>x.className='feedback');form.querySelectorAll('.answer').forEach(x=>x.classList.remove('is-correct','is-wrong'));const result=$('result-'+id);if(result)result.className='result';}});
$('content').addEventListener('input',e=>{if(e.target.dataset.reflection){state.reflections[e.target.dataset.reflection]=e.target.value;save()}if(e.target.id==='studentName'){state.name=e.target.value;save()}});
$('langSelect').addEventListener('change',e=>{const current=document.querySelector('form.quiz-form');if(current){const id=current.dataset.quiz;const draft=state.answers[id]||{};current.querySelectorAll('input[type=radio]:checked').forEach(x=>{draft[Number(x.name.slice(1))]=Number(x.value)});state.answers[id]=draft}state.lang=e.target.value;save();draw()});
$('menuOpen').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('shade').classList.toggle('show',open);$('menuOpen').setAttribute('aria-expanded',String(open))});$('shade').addEventListener('click',closeMenu);$('mobileHome').addEventListener('click',()=>jump('home'));$('fontDown').addEventListener('click',()=>changeFont(-.075));$('fontUp').addEventListener('click',()=>changeFont(.075));$('printBtn').addEventListener('click',()=>window.print());
function changeFont(n){state.font=Math.max(.9,Math.min(1.3,Math.round(((state.font||1)+n)*1000)/1000));document.documentElement.style.setProperty('--scale',state.font);save()}
window.addEventListener('hashchange',()=>{const id=location.hash.replace('#','');if(id&&id!==page)jump(id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.documentElement.style.setProperty('--scale',state.font||1);page=location.hash.slice(1)||'home';if(!['home','review','practice','glossary','record',...lessons.map(l=>l.id)].includes(page))page='home';draw();
})();
</script>
</body>
</html>
